<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MLB Predictor — Sign in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a1d2e; border: 1px solid #2a2d3e; border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; }
    h1 { font-size: 1.3rem; color: #4fc3f7; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: #888; margin-bottom: 20px; }
    label { font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 6px; }
    input { width: 100%; background: #2a2d3e; color: #e0e0e0; border: 1px solid #3a3d4e; padding: 10px 12px; border-radius: 6px; font-size: 0.95rem; margin-bottom: 14px; }
    input:focus { outline: none; border-color: #4fc3f7; }
    button { width: 100%; background: #4fc3f7; color: #0f1117; border: none; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    button:hover { background: #3eaae0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .err { display: none; background: #2a1010; border: 1px solid #ff6b6b; border-radius: 8px; color: #ff6b6b; font-size: 0.9rem; padding: 12px 14px; margin-top: 14px; line-height: 1.4; }
  </style>
</head>
<body>
<div class="card">
  <h1>⚾ One last step</h1>
  <p>Enter your email so I know who's stopping by.</p>
  <form method="POST" action="/identify">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" autofocus>
    <button type="submit">Continue</button>
    <div id="err" class="err"></div>
  </form>
</div>
<script>
  const errors = {
    email: 'Please enter a valid email address.',
    save:  'Something went wrong on our end — please try again.',
  };
  const e = new URLSearchParams(location.search).get('e');
  if (e) {
    const el = document.getElementById('err');
    el.textContent = errors[e] || 'Something went wrong. Please try again.';
    el.style.display = 'block';
  }
</script>
</body>
</html>
