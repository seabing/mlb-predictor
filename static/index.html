<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MLB Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
    header { background: #1a1d2e; padding: 16px 32px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #2a2d3e; }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #4fc3f7; }
    nav { display: flex; gap: 8px; margin-left: auto; }
    nav button { background: #2a2d3e; color: #e0e0e0; border: 1px solid #3a3d4e; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    nav button.active { background: #4fc3f7; color: #0f1117; font-weight: 600; }
    select { background: #2a2d3e; color: #e0e0e0; border: 1px solid #3a3d4e; padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
    .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    .section { background: #1a1d2e; border-radius: 10px; padding: 24px; margin-bottom: 24px; border: 1px solid #2a2d3e; }
    .section h2 { font-size: 1rem; font-weight: 600; color: #4fc3f7; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 8px 12px; color: #888; font-weight: 500; border-bottom: 1px solid #2a2d3e; }
    td { padding: 8px 12px; border-bottom: 1px solid #1e2130; }
    tr:hover td { background: #1e2233; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-il { background: #ff4444; color: white; }
    .badge-active { background: #2e7d32; color: white; }
    .badge-traded { background: #f57c00; color: white; }
    .matchup-card { background: #12151f; border-radius: 8px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .team-side { text-align: center; flex: 1; }
    .team-side h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .team-side p { font-size: 0.85rem; color: #888; }
    .vs { font-size: 1.5rem; font-weight: 700; color: #4fc3f7; padding: 0 24px; }
    .no-game { color: #888; font-style: italic; }
    .loading { color: #888; font-style: italic; }
    .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .trade-team { background: #12151f; border-radius: 8px; padding: 16px; }
    .trade-team h3 { font-size: 0.95rem; font-weight: 600; color: #4fc3f7; margin-bottom: 12px; }
    .trade-selects { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .trade-btn { background: #2a2d3e; border: 1px solid #3a3d4e; color: #e0e0e0; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
    .trade-btn:hover { background: #4fc3f7; color: #0f1117; }
    .trade-btn-danger { background: #2a2d3e; border: 1px solid #ff4444; color: #ff4444; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .trade-btn-danger:hover { background: #ff4444; color: white; }
    .traded-list { margin-top: 16px; }
    .traded-item { background: #1a1d2e; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; display: flex; justify-content: space-between; align-items: center; }
    .page { display: none; }
    .page.active { display: block; }
    @media (max-width: 600px) {
      header { flex-wrap: wrap; padding: 12px 16px; }
      nav { width: 100%; justify-content: center; }
      .trade-grid { grid-template-columns: 1fr; }
      .matchup-card { flex-direction: column; gap: 12px; }
      .vs { padding: 0; }
    }
  </style>
</head>

<script>
  const API = '/api';
  const _fetch = window.fetch;
  window.fetch = (url, opts = {}) => _fetch(url, { ...opts, credentials: 'include' });

  const teamNames = {
    ARI:'Arizona Diamondbacks', ATL:'Atlanta Braves', BAL:'Baltimore Orioles',
    BOS:'Boston Red Sox', CHC:'Chicago Cubs', CWS:'Chicago White Sox',
    CIN:'Cincinnati Reds', CLE:'Cleveland Guardians', COL:'Colorado Rockies',
    DET:'Detroit Tigers', HOU:'Houston Astros', KC:'Kansas City Royals',
    LAA:'Los Angeles Angels', LAD:'Los Angeles Dodgers', MIA:'Miami Marlins',
    MIL:'Milwaukee Brewers', MIN:'Minnesota Twins', NYM:'New York Mets',
    NYY:'New York Yankees', OAK:'Oakland Athletics', PHI:'Philadelphia Phillies',
    PIT:'Pittsburgh Pirates', SD:'San Diego Padres', SF:'San Francisco Giants',
    SEA:'Seattle Mariners', STL:'St. Louis Cardinals', TB:'Tampa Bay Rays',
    TEX:'Texas Rangers', TOR:'Toronto Blue Jays', WSH:'Washington Nationals'
  };

  let tradeRoster1Data = [];
  let tradeRoster2Data = [];
  let trades = [];
  let upcomingGames = [];
  let selectedTeamCode = '';

  function showPage(name, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    if (btn) btn.classList.add('active');
    if (name === 'trades') loadTradesFromServer();
  }

  // ROSTER PAGE
  document.getElementById('teamSelect').addEventListener('change', async function() {
    const team = this.value;
    if (!team) return;
    document.getElementById('rosterSection').style.display = 'none';
    document.getElementById('matchupSection').style.display = 'none';
    loadRoster(team);
    loadSchedule(team);
  });

  async function loadRoster(team) {
    document.getElementById('rosterSection').style.display = 'block';
    document.getElementById('rosterTeamName').textContent = teamNames[team] || team;
    document.getElementById('hittersBody').innerHTML = '<tr><td colspan="4" class="loading">Loading roster...</td></tr>';
    document.getElementById('pitchersBody').innerHTML = '';

    const resp = await fetch(`${API}/roster/${team}`);
    const data = await resp.json();

    const active = data.roster.filter(p => p.status === 'Active');
    const hitters = active.filter(p => p.position_type !== 'Pitcher');
    const pitchers = active.filter(p => p.position_type === 'Pitcher');
    const ilPlayers = data.roster.filter(p => p.il);

    let hitterRows = hitters.map(p => `
      <tr>
        <td>${p.jersey}</td>
        <td>${p.name}</td>
        <td>${p.position}</td>
        <td><span class="badge badge-active">Active</span></td>
      </tr>`).join('');

    ilPlayers.filter(p => p.position_type !== 'Pitcher').forEach(p => {
      hitterRows += `<tr>
        <td>${p.jersey}</td>
        <td>${p.name}</td>
        <td>${p.position}</td>
        <td><span class="badge badge-il">${p.status}</span></td>
      </tr>`;
    });

    let pitcherRows = pitchers.map(p => `
      <tr>
        <td>${p.jersey}</td>
        <td>${p.name}</td>
        <td><span class="badge badge-active">Active</span></td>
      </tr>`).join('');

    ilPlayers.filter(p => p.position_type === 'Pitcher').forEach(p => {
      pitcherRows += `<tr>
        <td>${p.jersey}</td>
        <td>${p.name}</td>
        <td><span class="badge badge-il">${p.status}</span></td>
      </tr>`;
    });

    document.getElementById('hittersBody').innerHTML = hitterRows || '<tr><td colspan="4">No hitters found</td></tr>';
    document.getElementById('pitchersBody').innerHTML = pitcherRows || '<tr><td colspan="3">No pitchers found</td></tr>';
  }

  async function loadSchedule(team) {
    document.getElementById('matchupSection').style.display = 'block';
    document.getElementById('matchupContent').innerHTML = '<p class="loading">Loading schedule...</p>';

    const resp = await fetch(`${API}/schedule/${team}`);
    const data = await resp.json();

    if (!data.games || data.games.length === 0) {
      document.getElementById('matchupContent').innerHTML = '<p class="no-game">No game scheduled today.</p>';
      return;
    }

    const game = data.games[0];
    document.getElementById('matchupContent').innerHTML = `
      <div class="matchup-card">
        <div class="team-side">
          <h3>${teamNames[team] || team}</h3>
          <p>SP: ${game.our_probable_pitcher}</p>
        </div>
        <div class="vs">${game.home_away === 'Home' ? 'vs' : '@'}</div>
        <div class="team-side">
          <h3>${game.opponent}</h3>
          <p>SP: ${game.opponent_probable_pitcher}</p>
        </div>
      </div>
      <p style="margin-top:12px; font-size:0.85rem; color:#888;">📍 ${game.venue} &nbsp;|&nbsp; ${game.status}</p>
    `;
  }

  // MATCHUP PAGE
  document.getElementById('matchupTeamSelect').addEventListener('change', async function() {
    const team = this.value;
    if (!team) return;
    selectedTeamCode = team;
    document.getElementById('upcomingContent').innerHTML = '<p class="loading">Loading schedule...</p>';
    const resp = await fetch(`${API}/upcoming/${team}`);
    const data = await resp.json();
    upcomingGames = data.games || [];
    if (upcomingGames.length === 0) {
      document.getElementById('upcomingContent').innerHTML = '<p class="no-game">No upcoming games found.</p>';
      return;
    }
    renderUpcoming();
  });

  function renderUpcoming() {
    const rows = upcomingGames.map((g, i) => `
      <div class="matchup-card" style="margin-bottom:12px;">
        <div class="team-side">
          <h3>${teamNames[selectedTeamCode]}</h3>
          <p>SP: ${g.our_probable_pitcher}</p>
        </div>
        <div style="text-align:center; padding: 0 16px;">
          <div class="vs">${g.home_away === 'Home' ? 'vs' : '@'}</div>
          <div style="font-size:0.8rem; color:#888; margin-top:4px;">${g.date}</div>
          <div style="font-size:0.75rem; color:#666;">${g.status}</div>
          <button class="trade-btn" style="margin-top:8px;" onclick="runPrediction(${i}, '${g.date}')">Predict</button>
        </div>
        <div class="team-side">
          <h3>${g.opponent}</h3>
          <p>SP: ${g.opponent_probable_pitcher}</p>
        </div>
      </div>
      <div id="prediction-${i}" style="display:none; background:#12151f; border-radius:8px; padding:16px; margin-bottom:12px; margin-top:-8px;"></div>
    `).join('');
    document.getElementById('upcomingContent').innerHTML = rows;
  }

  async function runPrediction(index, gameDate) {
    const game = upcomingGames[index];
    const predDiv = document.getElementById(`prediction-${index}`);
    predDiv.style.display = 'block';
    predDiv.innerHTML = '<p class="loading">Running prediction... this may take 20-30 seconds...</p>';

    const homeTeam = game.home_away === 'Home' ? selectedTeamCode : game.opponent_code;
    const awayTeam = game.home_away === 'Away' ? selectedTeamCode : game.opponent_code;

    const result = await fetch(`${API}/predict`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        home_team: homeTeam,
        away_team: awayTeam,
        game_date: gameDate,
        game_id: g.game_id
      })
    }).then(r => r.json());

    const homeTeamName = teamNames[homeTeam] || homeTeam;
    const awayTeamName = teamNames[awayTeam] || awayTeam;
    const homeWin = result.home_win_pct;
    const awayWin = result.away_win_pct;
    const favored = homeWin >= awayWin ? homeTeamName : awayTeamName;
    const favPct = homeWin >= awayWin ? homeWin : awayWin;

    predDiv.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div style="text-align:center; flex:1;">
          <div style="font-size:1.8rem; font-weight:700; color:#4fc3f7;">${homeWin}%</div>
          <div style="font-size:0.85rem; color:#888;">${homeTeamName}</div>
        </div>
        <div style="text-align:center; padding:0 16px;">
          <div style="font-size:0.8rem; color:#666;">WIN PROBABILITY</div>
        </div>
        <div style="text-align:center; flex:1;">
          <div style="font-size:1.8rem; font-weight:700; color:#4fc3f7;">${awayWin}%</div>
          <div style="font-size:0.85rem; color:#888;">${awayTeamName}</div>
        </div>
      </div>
      <div style="background:#1a1d2e; border-radius:6px; height:8px; overflow:hidden; margin-bottom:12px;">
        <div style="background:#4fc3f7; height:100%; width:${homeWin}%;"></div>
      </div>
      <p style="text-align:center; font-size:0.85rem; color:#aaa;">🏆 Model favors <strong>${favored}</strong> at ${favPct}%</p>
      <p style="text-align:center; font-size:0.75rem; color:#555; margin-top:6px;">Data source: ${result.lineup_source === 'mlb_api' ? '✅ Official MLB lineup' : result.lineup_source === 'manual' ? '✏️ Manual lineup' : '📋 Full roster'}</p>
    `;
  }

  // TRADE SIMULATOR
  async function loadTradesFromServer() {
    const resp = await fetch(`${API}/trades`);
    const data = await resp.json();
    trades = data.trades || [];
    renderTrades();
  }

  async function loadTradeRosters() {
    const t1 = document.getElementById('tradeTeam1').value;
    const t2 = document.getElementById('tradeTeam2').value;
    if (!t1 || !t2) { alert('Please select two teams.'); return; }
    if (t1 === t2) { alert('Please select two different teams.'); return; }

    document.getElementById('tradeTeam1Name').textContent = teamNames[t1];
    document.getElementById('tradeTeam2Name').textContent = teamNames[t2];
    document.getElementById('tradeRoster1').innerHTML = '<tr><td colspan="3" class="loading">Loading...</td></tr>';
    document.getElementById('tradeRoster2').innerHTML = '<tr><td colspan="3" class="loading">Loading...</td></tr>';

    const [r1, r2] = await Promise.all([
      fetch(`${API}/roster/${t1}`).then(r => r.json()),
      fetch(`${API}/roster/${t2}`).then(r => r.json())
    ]);

    tradeRoster1Data = r1.roster.filter(p => p.status === 'Active');
    tradeRoster2Data = r2.roster.filter(p => p.status === 'Active');

    renderTradeRosters(t1, t2);
  }

  function renderTradeRosters(t1, t2) {
    t1 = t1 || document.getElementById('tradeTeam1').value;
    t2 = t2 || document.getElementById('tradeTeam2').value;

    const tradedToT2 = trades.filter(t => t.from_team === t1 && t.to_team === t2).map(t => t.player_id);
    const tradedToT1 = trades.filter(t => t.from_team === t2 && t.to_team === t1).map(t => t.player_id);

    const rows1 = tradeRoster1Data.map(p => {
      const traded = tradedToT2.includes(p.id);
      return `<tr>
        <td>${p.name}${traded ? ' <span class="badge badge-traded">Traded</span>' : ''}</td>
        <td>${p.position}</td>
        <td>${!traded ? `<button class="trade-btn" onclick="executeTrade(${p.id}, '${p.name}', '${t1}', '${t2}')">→ ${document.getElementById('tradeTeam2').options[document.getElementById('tradeTeam2').selectedIndex].text.split(' ')[0]}</button>` : ''}</td>
      </tr>`;
    }).join('');

    const incoming1 = trades.filter(t => t.from_team === t2 && t.to_team === t1);
    const incomingRows1 = incoming1.map(p => `<tr>
      <td>${p.player_name} <span class="badge badge-traded">Acquired</span></td>
      <td>—</td><td></td>
    </tr>`).join('');

    const rows2 = tradeRoster2Data.map(p => {
      const traded = tradedToT1.includes(p.id);
      return `<tr>
        <td>${p.name}${traded ? ' <span class="badge badge-traded">Traded</span>' : ''}</td>
        <td>${p.position}</td>
        <td>${!traded ? `<button class="trade-btn" onclick="executeTrade(${p.id}, '${p.name}', '${t2}', '${t1}')">→ ${document.getElementById('tradeTeam1').options[document.getElementById('tradeTeam1').selectedIndex].text.split(' ')[0]}</button>` : ''}</td>
      </tr>`;
    }).join('');

    const incoming2 = trades.filter(t => t.from_team === t1 && t.to_team === t2);
    const incomingRows2 = incoming2.map(p => `<tr>
      <td>${p.player_name} <span class="badge badge-traded">Acquired</span></td>
      <td>—</td><td></td>
    </tr>`).join('');

    document.getElementById('tradeRoster1').innerHTML = rows1 + incomingRows1;
    document.getElementById('tradeRoster2').innerHTML = rows2 + incomingRows2;

    renderTrades();
  }

  async function executeTrade(playerId, playerName, fromTeam, toTeam) {
    await fetch(`${API}/trades`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: playerId, player_name: playerName, from_team: fromTeam, to_team: toTeam })
    });
    await loadTradesFromServer();
    renderTradeRosters();
  }

  function renderTrades() {
    const container = document.getElementById('tradedItems');
    const section = document.getElementById('tradedList');
    if (trades.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    container.innerHTML = trades.map(t => `
      <div class="traded-item">
        <span><strong>${t.player_name}</strong> — ${t.from_team} → ${t.to_team}</span>
      </div>
    `).join('');
  }

  async function resetTrades() {
    if (!confirm('Reset all trades?')) return;
    await fetch(`${API}/trades`, { method: 'DELETE' });
    trades = [];
    renderTrades();
    renderTradeRosters();
  }

  loadTradesFromServer();
</script>

</body>
</html>
